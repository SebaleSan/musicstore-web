<nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand" routerLink="/" (click)="closeMenu()">MUSIC<span>STORE</span></a>
    <button class="navbar-toggler" type="button" aria-controls="mainNav" aria-label="Abrir menú"
      [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav" [class.show]="menuOpen()">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/catalog" routerLinkActive="active" (click)="closeMenu()">Catálogo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/catalog" fragment="search" (click)="closeMenu()">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398l3.85 3.85a1 1 0 0 0 1.415-1.414zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
            </svg>
            Buscar
          </a>
        </li>
        @if (auth.isAdmin()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/albums" routerLinkActive="active" (click)="closeMenu()">Gestión de catálogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/users" routerLinkActive="active" (click)="closeMenu()">Gestión de usuarios</a>
          </li>
        }
      </ul>
      <ul class="navbar-nav align-items-lg-center">
        @if (auth.isLoggedIn()) {
          @if (!auth.isAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/cart" routerLinkActive="active" (click)="closeMenu()">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2" />
                </svg>
                Carrito
              </a>
            </li>
          }
          <li class="nav-item">
            <a class="nav-link" routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">
              <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1" />
              </svg>
              Perfil
            </a>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" (click)="logout()">Cerrar sesión</button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Iniciar sesión</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-dark btn-sm ms-lg-2 my-2 my-lg-0" routerLink="/register" (click)="closeMenu()">Registrarse</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
