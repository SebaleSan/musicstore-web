<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-4">Crear cuenta</h1>

          @if (error()) {
            <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
          }

          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input id="username" type="text" class="form-control" formControlName="username"
                required minlength="3" maxlength="50" pattern="[a-zA-Z0-9_]+" autocomplete="username"
                [class.is-invalid]="usernameError()">
              <div class="invalid-feedback">{{ usernameError() }}</div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Correo</label>
              <input id="email" type="email" class="form-control" formControlName="email"
                required maxlength="100" [pattern]="emailPattern" autocomplete="email" [class.is-invalid]="emailError()">
              <div class="invalid-feedback">{{ emailError() }}</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input id="password" class="form-control" formControlName="password" autocomplete="new-password"
                required minlength="8" maxlength="100" [pattern]="passwordPattern"
                [type]="showPassword() ? 'text' : 'password'" [class.is-invalid]="passwordError()">
              <div class="invalid-feedback">{{ passwordError() }}</div>
              <ul class="list-unstyled small mt-2 mb-0">
                @for (rule of rules; track rule.key) {
                  <li [class.text-success]="rule.test(password())" [class.text-body-secondary]="!password()"
                    [class.text-danger]="password() && !rule.test(password())">
                    {{ password() && rule.test(password()) ? '✓' : '•' }} {{ rule.label }}
                  </li>
                }
              </ul>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
              <input id="confirmPassword" class="form-control" formControlName="confirmPassword" autocomplete="new-password"
                required maxlength="100" [type]="showPassword() ? 'text' : 'password'" [class.is-invalid]="confirmError()">
              <div class="invalid-feedback">{{ confirmError() }}</div>
            </div>

            <div class="form-check mb-4">
              <input id="showPassword" class="form-check-input" type="checkbox" [checked]="showPassword()"
                (change)="showPassword.set(!showPassword())">
              <label class="form-check-label" for="showPassword">Mostrar contraseñas</label>
            </div>

            <button type="submit" class="btn btn-dark w-100" [disabled]="saving()">
              {{ saving() ? 'Creando cuenta...' : 'Crear cuenta' }}
            </button>

            <p class="small text-center mt-3 mb-0">
              ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
